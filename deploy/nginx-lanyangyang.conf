# =============================================================================
# Lanyangyang 站点配置
#
#   http://<服务器IP>/            -> 懒羊羊界面
#   http://<服务器IP>/api/*       -> 反代 127.0.0.1:3000
#   http://<服务器IP>/download/   -> 安装包下载
#   http://xiajundan.cn/          -> 301 到 https
#   https://xiajundan.cn/         -> 同一个懒羊羊界面（证书由 certbot 签发）
#
# 说明：
#   · IP 用 default_server 接住所有直接打 IP 的请求
#   · 域名块沿用已有 Let's Encrypt 证书（/etc/letsencrypt/live/xiajundan.cn）
#   · 原模具站点配置已被备份并停用，站点文件 /opt/mold 与 8088 服务未删除
# =============================================================================

# ------------------------------ IP 直访（80） -------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /opt/lanyangyang-web;
    index index.html;

    client_max_body_size 200m;

    access_log /var/log/nginx/lanyangyang-web.access.log;
    error_log  /var/log/nginx/lanyangyang-web.error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location /download/ {
        alias /opt/lanyangyang-web/download/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------- 域名 http -> https -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name xiajundan.cn www.xiajundan.cn;

    return 301 https://$host$request_uri;
}

# ------------------------------ 域名 https ----------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xiajundan.cn www.xiajundan.cn;

    root /opt/lanyangyang-web;
    index index.html;

    client_max_body_size 200m;

    ssl_certificate     /etc/letsencrypt/live/xiajundan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiajundan.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lanyangyang-web.access.log;
    error_log  /var/log/nginx/lanyangyang-web.error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location /download/ {
        alias /opt/lanyangyang-web/download/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
